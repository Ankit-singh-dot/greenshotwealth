<svg viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" class="w-full h-full">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf9f5" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#f1ece3" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#fbfaf7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#eae5dc" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f1ea" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fbfaf7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ece7de" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="waveGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0ebe1" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#fcfbfa" stop-opacity="0.1" />
      <stop offset="80%" stop-color="#ede8df" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#f8f5ee" stop-opacity="0.85" />
    </linearGradient>
    <filter id="waveBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <!-- Base tone -->
  <rect width="1200" height="500" fill="#ffffff" />

  <!-- Diagonal wave 1 from top-left curving down -->
  <path d="M-50,0 C200,80 350,180 300,320 C250,450 150,480 -50,500 Z" fill="url(#waveGrad1)" filter="url(#waveBlur)" opacity="0.85" />

  <!-- Flowing diagonal silk crest from top-right down across center-right -->
  <path d="M800,-50 C950,100 1150,180 1250,220 L1250,-50 Z" fill="url(#waveGrad2)" filter="url(#waveBlur)" opacity="0.75" />
  <path d="M650,-50 C800,120 1000,280 1250,380 L1250,550 L950,550 C750,400 550,250 650,-50 Z" fill="url(#waveGrad2)" filter="url(#waveBlur)" opacity="0.6" />

  <!-- Sweeping bottom arc -->
  <path d="M-50,380 C300,320 600,420 900,360 C1050,330 1150,380 1250,420 L1250,550 L-50,550 Z" fill="url(#waveGrad3)" filter="url(#waveBlur)" opacity="0.7" />

  <!-- Delicate accent ridge curves -->
  <path d="M0,180 Q320,120 620,280 T1200,220" stroke="#e6dfd3" stroke-width="2.5" fill="none" opacity="0.4" filter="url(#waveBlur)" />
  <path d="M100,0 Q400,220 850,240 T1250,480" stroke="#ded6c8" stroke-width="3" fill="none" opacity="0.35" filter="url(#waveBlur)" />
</svg>